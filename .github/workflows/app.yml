          cat << 'EOF' > app/src/main/java/com/example/jpthtranslator/MainActivity.kt
          package com.example.jpthtranslator

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*

          class MainActivity : Activity() {

              private lateinit var apiKeyInput: EditText
              private lateinit var bilingualSwitch: Switch
              private lateinit var statusText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("sub_prefs", Context.MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(56, 80, 56, 56)
                  }

                  val title = TextView(this).apply {
                      text = "JP → TH Live Subtitle"
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 12)
                  }

                  val desc = TextView(this).apply {
                      text = "แปลเสียงวิดีโอจาก Chrome (ใส่หลาย API Key คั่นด้วย , ได้)"
                      textSize = 14f
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, 0, 0, 48)
                  }

                  val inputBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#1E293B"))
                      cornerRadius = 24f
                      setStroke(2, Color.parseColor("#334155"))
                  }

                  apiKeyInput = EditText(this).apply {
                      hint = "วาง Gemini API Key (เช่น AIza1..., AIza2...)"
                      setHintTextColor(Color.parseColor("#64748B"))
                      setTextColor(Color.WHITE)
                      setText(prefs.getString("api_key", ""))
                      background = inputBg
                      setPadding(36, 32, 36, 32)
                      setSingleLine()
                  }

                  bilingualSwitch = Switch(this).apply {
                      text = "แสดงซับญี่ปุ่นต้นฉบับคู่กับคำแปลไทย"
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      isChecked = prefs.getBoolean("bilingual", false)
                      setPadding(8, 40, 8, 40)
                  }

                  val startBtnBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#2563EB"))
                      cornerRadius = 28f
                  }

                  val startBtn = Button(this).apply {
                      text = "เปิดซับไตเติลลอยจอ"
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      background = startBtnBg
                      setPadding(0, 32, 0, 32)
                      setOnClickListener {
                          val key = apiKeyInput.text.toString().trim()
                          if (key.isEmpty()) {
                              Toast.makeText(this@MainActivity, "กรุณาใส่ Gemini API Key ก่อน", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          prefs.edit()
                              .putString("api_key", key)
                              .putBoolean("bilingual", bilingualSwitch.isChecked)
                              .apply()
                          checkPermissionsAndStart()
                      }
                  }

                  val stopBtn = Button(this).apply {
                      text = "หยุดการทำงาน"
                      setTextColor(Color.parseColor("#F87171"))
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(0, 28, 0, 28)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, LiveTranslateService::class.java))
                          statusText.text = "สถานะ: หยุดการทำงานแล้ว"
                      }
                  }

                  statusText = TextView(this).apply {
                      text = "สถานะ: พร้อมใช้งาน (โหมดประหยัดโควตาอัตโนมัติ)"
                      textSize = 14f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setPadding(0, 24, 0, 0)
                  }

                  root.addView(title)
                  root.addView(desc)
                  root.addView(apiKeyInput)
                  root.addView(bilingualSwitch)
                  root.addView(startBtn)
                  root.addView(stopBtn)
                  root.addView(statusText)
                  setContentView(root)
              }

              private fun checkPermissionsAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "กรุณาเปิดสิทธิ์ 'แสดงทับแอปอื่น' แล้วกดย้อนกลับ", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = perms.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), 100)
                  } else {
                      requestAudioCapture()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  if (requestCode == 100 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      requestAudioCapture()
                  } else {
                      statusText.text = "จำเป็นต้องอนุญาตสิทธิ์เสียงก่อนใช้งาน"
                  }
              }

              private fun requestAudioCapture() {
                  val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mgr.createScreenCaptureIntent(), 200)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 200 && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, LiveTranslateService::class.java).apply {
                          putExtra("RESULT_CODE", resultCode)
                          putExtra("DATA", data)
                          putExtra("API_KEY", apiKeyInput.text.toString().trim())
                          putExtra("BILINGUAL", bilingualSwitch.isChecked)
                      }
                      startForegroundService(intent)
                      statusText.text = "กำลังทำงาน: เปิด Chrome เล่นวิดีโอได้เลย"
                      moveTaskToBack(true)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/jpthtranslator/LiveTranslateService.kt
          package com.example.jpthtranslator

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.util.Base64
          import android.view.*
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlinx.coroutines.*
          import kotlinx.coroutines.channels.BufferOverflow
          import kotlinx.coroutines.channels.Channel
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.sqrt

          class LiveTranslateService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var overlayRoot: LinearLayout
              private lateinit var statusLabel: TextView
              private lateinit var jpTextView: TextView
              private lateinit var thTextView: TextView

              private var mediaProjection: MediaProjection? = null
              private var audioRecord: AudioRecord? = null
              private var apiKeys: List<String> = emptyList()
              private var currentKeyIndex = 0
              private var showBilingual = false
              private var isPaused = false
              private var fontSize = 17f

              private val candidateModels = mutableListOf<String>()
              private var currentModelIndex = 0

              private val mainHandler = Handler(Looper.getMainLooper())
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private val audioChannel = Channel<ByteArray>(capacity = 1, onBufferOverflow = BufferOverflow.DROP_OLDEST)

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundNotif()
                  val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  val rawKey = intent.getStringExtra("API_KEY") ?: ""
                  apiKeys = rawKey.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                  showBilingual = intent.getBooleanExtra("BILINGUAL", false)

                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra("DATA", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent.getParcelableExtra("DATA")
                  }

                  if (data == null || apiKeys.isEmpty()) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  setupOverlay()
                  val mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = mgr.getMediaProjection(resultCode, data)
                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, mainHandler)

                  startTranslator()
                  startAudioCapture()
                  return START_STICKY
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupOverlay() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val sw = resources.displayMetrics.widthPixels
                  val sh = resources.displayMetrics.heightPixels

                  val bg = GradientDrawable().apply {
                      setColor(Color.parseColor("#EB0F172A"))
                      cornerRadius = 32f
                      setStroke(2, Color.parseColor("#38BDF8"))
                  }

                  overlayRoot = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = bg
                      setPadding(32, 18, 32, 22)
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 8)
                  }

                  statusLabel = TextView(this).apply {
                      text = "● รอเสียงจากวิดีโอ..."
                      textSize = 12f
                      setTextColor(Color.parseColor("#94A3B8"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val fontDownBtn = TextView(this).apply {
                      text = " A- "
                      textSize = 13f
                      setTextColor(Color.LTGRAY)
                      setPadding(12, 4, 12, 4)
                      setOnClickListener {
                          fontSize = (fontSize - 2f).coerceAtLeast(12f)
                          thTextView.textSize = fontSize
                          jpTextView.textSize = (fontSize - 3f).coerceAtLeast(10f)
                      }
                  }

                  val fontUpBtn = TextView(this).apply {
                      text = " A+ "
                      textSize = 13f
                      setTextColor(Color.LTGRAY)
                      setPadding(12, 4, 12, 4)
                      setOnClickListener {
                          fontSize = (fontSize + 2f).coerceAtMost(28f)
                          thTextView.textSize = fontSize
                          jpTextView.textSize = (fontSize - 3f).coerceAtLeast(10f)
                      }
                  }

                  val pauseBtn = TextView(this).apply {
                      text = " ⏸ "
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setPadding(14, 4, 14, 4)
                      setOnClickListener {
                          isPaused = !isPaused
                          text = if (isPaused) " ▶ " else " ⏸ "
                          statusLabel.text = if (isPaused) "● หยุดแปลชั่วคราว" else "● รอเสียงจากวิดีโอ..."
                          statusLabel.setTextColor(if (isPaused) Color.parseColor("#FBBF24") else Color.parseColor("#94A3B8"))
                      }
                  }

                  val closeBtn = TextView(this).apply {
                      text = " ✕"
                      textSize = 16f
                      setTextColor(Color.parseColor("#F87171"))
                      setPadding(14, 4, 4, 4)
                      setOnClickListener { stopSelf() }
                  }

                  topBar.addView(statusLabel)
                  topBar.addView(fontDownBtn)
                  topBar.addView(fontUpBtn)
                  topBar.addView(pauseBtn)
                  topBar.addView(closeBtn)

                  jpTextView = TextView(this).apply {
                      text = ""
                      textSize = fontSize - 3f
                      setTextColor(Color.parseColor("#94A3B8"))
                      visibility = View.GONE
                      setPadding(0, 0, 0, 6)
                  }

                  thTextView = TextView(this).apply {
                      text = "เล่นวิดีโอภาษาญี่ปุ่นใน Chrome ได้เลย..."
                      textSize = fontSize
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }

                  overlayRoot.addView(topBar)
                  overlayRoot.addView(jpTextView)
                  overlayRoot.addView(thTextView)

                  val params = WindowManager.LayoutParams(
                      (sw * 0.92).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (sw * 0.04).toInt()
                      y = sh - 400
                  }

                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                  overlayRoot.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ix = params.x; iy = params.y; tx = e.rawX; ty = e.rawY; true }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = ix + (e.rawX - tx).toInt()
                              params.y = iy + (e.rawY - ty).toInt()
                              windowManager.updateViewLayout(overlayRoot, params)
                              true
                          }
                          else -> false
                      }
                  }
                  windowManager.addView(overlayRoot, params)
              }

              private fun updateStatus(text: String, colorHex: String) {
                  mainHandler.post {
                      if (!isPaused) {
                          statusLabel.text = text
                          statusLabel.setTextColor(Color.parseColor(colorHex))
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startAudioCapture() {
                  val proj = mediaProjection ?: return
                  val config = AudioPlaybackCaptureConfiguration.Builder(proj)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val sr = 16000
                  val fmt = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(sr)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()

                  val minBuf = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  audioRecord = AudioRecord.Builder()
                      .setAudioPlaybackCaptureConfig(config)
                      .setAudioFormat(fmt)
                      .setBufferSizeInBytes(minBuf * 2)
                      .build()

                  if (audioRecord?.state != AudioRecord.STATE_INITIALIZED) {
                      updateStatus("● ดักเสียงไม่ได้ (ลองเลือกแชร์ทั้งหน้าจอ)", "#F87171")
                      return
                  }

                  audioRecord?.startRecording()

                  scope.launch {
                      val buf = ByteArray(1024)
                      val acc = ByteArrayOutputStream()
                      var startT = System.currentTimeMillis()
                      var lastSpeechT = 0L
                      var hasSpeech = false
                      var lastUiUpdate = 0L

                      while (isActive) {
                          val read = audioRecord?.read(buf, 0, buf.size) ?: 0
                          if (isPaused) {
                              acc.reset()
                              hasSpeech = false
                              continue
                          }
                          if (read > 0) {
                              val rms = calcRms(buf, read)
                              val now = System.currentTimeMillis()

                              if (rms > 130.0) {
                                  if (!hasSpeech && now - lastUiUpdate > 400) {
                                      updateStatus("● ได้ยินเสียง...", "#34D399")
                                      lastUiUpdate = now
                                  }
                                  hasSpeech = true
                                  lastSpeechT = now
                              }

                              if (hasSpeech) acc.write(buf, 0, read) else startT = now

                              val elapsed = now - startT
                              val silence = now - lastSpeechT
                              // ตัดส่งทุกๆ 4.5 วินาที หรือเมื่อเงียบเกิน 0.75 วิ เพื่อประหยัดโควตาและแปลได้เต็มประโยค
                              if (hasSpeech && ((silence > 750 && elapsed > 1500) || elapsed >= 4500)) {
                                  val pcm = acc.toByteArray()
                                  acc.reset()
                                  hasSpeech = false
                                  startT = now
                                  audioChannel.trySend(pcm)
                              }
                          }
                      }
                  }
              }

              private fun discoverFlashModels() {
                  try {
                      val firstKey = apiKeys.first()
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models?key=$firstKey")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          connectTimeout = 5000
                          readTimeout = 5000
                      }
                      if (conn.responseCode == 200) {
                          val resp = conn.inputStream.bufferedReader().use { it.readText() }
                          val modelsArr = JSONObject(resp).optJSONArray("models")
                          val found = mutableListOf<String>()
                          if (modelsArr != null) {
                              for (i in 0 until modelsArr.length()) {
                                  val m = modelsArr.getJSONObject(i)
                                  val name = m.optString("name", "").removePrefix("models/")
                                  val methods = m.optJSONArray("supportedGenerationMethods")?.toString() ?: ""
                                  if (methods.contains("generateContent") &&
                                      name.contains("flash", ignoreCase = true) &&
                                      !name.contains("image", ignoreCase = true) &&
                                      !name.contains("tts", ignoreCase = true) &&
                                      !name.contains("embedding", ignoreCase = true) &&
                                      !name.contains("thinking", ignoreCase = true)
                                  ) {
                                      found.add(name)
                                  }
                              }
                          }
                          val sorted = found.sortedWith(compareByDescending<String> { it.contains("lite") }.thenByDescending { it })
                          candidateModels.clear()
                          candidateModels.addAll(sorted)
                      }
                  } catch (_: Exception) {}

                  listOf("gemini-2.5-flash-lite", "gemini-2.5-flash", "gemini-2.0-flash-lite", "gemini-2.0-flash").forEach { fallback ->
                      if (!candidateModels.contains(fallback)) candidateModels.add(fallback)
                  }
                  currentModelIndex = 0
              }

              private fun startTranslator() {
                  scope.launch {
                      discoverFlashModels()
                      for (pcm in audioChannel) {
                          if (isPaused) continue
                          updateStatus("● กำลังแปล...", "#38BDF8")
                          val wav = pcmToWav(pcm, 16000)
                          val res = callGeminiWithFallback(wav)
                          if (res.startsWith("ERR:")) {
                              updateStatus("● ${res.removePrefix("ERR:")}", "#F87171")
                          } else if (res.isNotBlank() && !res.contains("SILENT", ignoreCase = true)) {
                              val lines = res.lines().map { it.trim() }.filter { it.isNotEmpty() }
                              val jp = lines.find { it.startsWith("JP:", ignoreCase = true) }?.substringAfter(":")?.trim() ?: ""
                              val th = lines.find { it.startsWith("TH:", ignoreCase = true) }?.substringAfter(":")?.trim() ?: res

                              withContext(Dispatchers.Main) {
                                  if (showBilingual && jp.isNotEmpty()) {
                                      jpTextView.visibility = View.VISIBLE
                                      jpTextView.text = jp
                                  } else {
                                      jpTextView.visibility = View.GONE
                                  }
                                  thTextView.text = th
                                  statusLabel.text = "● พร้อมฟังต่อ"
                                  statusLabel.setTextColor(Color.parseColor("#34D399"))
                              }
                          } else {
                              updateStatus("● รอเสียงพูด...", "#94A3B8")
                          }
                      }
                  }
              }

              private fun callGeminiWithFallback(wav: ByteArray): String {
                  if (candidateModels.isEmpty()) discoverFlashModels()
                  val totalCombinations = candidateModels.size * apiKeys.size
                  var attempts = 0
                  var lastError = ""

                  while (attempts < totalCombinations) {
                      val model = candidateModels[currentModelIndex]
                      val key = apiKeys[currentKeyIndex]
                      val result = callGeminiSingleModel(wav, model, key)

                      if (result == "MODEL_404") {
                          currentModelIndex = (currentModelIndex + 1) % candidateModels.size
                          lastError = "ERR:ไม่พบโมเดล ($model)"
                          attempts++
                          continue
                      }
                      if (result == "RATE_429") {
                          currentModelIndex = (currentModelIndex + 1) % candidateModels.size
                          if (currentModelIndex == 0 && apiKeys.size > 1) {
                              currentKeyIndex = (currentKeyIndex + 1) % apiKeys.size
                          }
                          lastError = "ERR:โควตาเต็ม รอสักครู่..."
                          attempts++
                          continue
                      }
                      return result
                  }
                  return lastError.ifEmpty { "ERR:โควตาเต็ม รอสักครู่..." }
              }

              private fun callGeminiSingleModel(wav: ByteArray, modelName: String, activeKey: String): String {
                  return try {
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$modelName:generateContent?key=$activeKey")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                          doOutput = true
                          connectTimeout = 7000
                          readTimeout = 7000
                      }
                      val b64 = Base64.encodeToString(wav, Base64.NO_WRAP)
                      val prompt = if (showBilingual) {
                          "ถอดเสียงญี่ปุ่นและแปลเป็นซับไทยสั้นกระชับ ตอบ 2 บรรทัดเท่านั้น:\nJP: <ญี่ปุ่น>\nTH: <ไทย>\nถ้าไม่มีเสียงพูดตอบ SILENT"
                      } else {
                          "ฟังเสียงญี่ปุ่นแล้วแปลเป็นซับไตเติลภาษาไทยสั้นๆ กระชับ เป็นธรรมชาติ ตอบเฉพาะคำแปลไทยเท่านั้น ถ้าไม่มีเสียงพูดตอบ SILENT"
                      }

                      val safety = JSONArray().apply {
                          listOf("HARM_CATEGORY_HARASSMENT", "HARM_CATEGORY_HATE_SPEECH", "HARM_CATEGORY_SEXUALLY_EXPLICIT", "HARM_CATEGORY_DANGEROUS_CONTENT").forEach { cat ->
                              put(JSONObject().put("category", cat).put("threshold", "BLOCK_NONE"))
                          }
                      }

                      val genConfig = JSONObject().apply {
                          put("temperature", 0.2)
                          if (modelName.contains("2.5") || modelName.contains("3")) {
                              put("thinkingConfig", JSONObject().put("thinkingBudget", 0))
                          }
                      }

                      val body = JSONObject().apply {
                          put("contents", JSONArray().put(JSONObject().apply {
                              put("parts", JSONArray().apply {
                                  put(JSONObject().put("text", prompt))
                                  put(JSONObject().put("inline_data", JSONObject().apply {
                                      put("mime_type", "audio/wav")
                                      put("data", b64)
                                  }))
                              })
                          }))
                          put("safetySettings", safety)
                          put("generationConfig", genConfig)
                      }

                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }

                      when (conn.responseCode) {
                          200 -> {
                              val text = conn.inputStream.bufferedReader().use { it.readText() }
                              val candidate = JSONObject(text).optJSONArray("candidates")?.optJSONObject(0)
                              val partText = candidate?.optJSONObject("content")?.optJSONArray("parts")?.optJSONObject(0)?.optString("text", "") ?: ""
                              partText.trim()
                          }
                          404 -> "MODEL_404"
                          429 -> "RATE_429"
                          400, 403 -> "ERR:API Key ไม่ถูกต้อง (${conn.responseCode})"
                          else -> "ERR:เซิร์ฟเวอร์ (${conn.responseCode})"
                      }
                  } catch (e: Exception) {
                      "ERR:เน็ตช้า/หมดเวลา"
                  }
              }

              private fun calcRms(buf: ByteArray, len: Int): Double {
                  var sum = 0.0
                  val count = len / 2
                  if (count == 0) return 0.0
                  for (i in 0 until len - 1 step 2) {
                      val s = ((buf[i + 1].toInt() shl 8) or (buf[i].toInt() and 0xFF)).toShort()
                      sum += s * s
                  }
                  return sqrt(sum / count)
              }

              private fun pcmToWav(pcm: ByteArray, sr: Int): ByteArray {
                  val header = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN).apply {
                      put("RIFF".toByteArray()); putInt(pcm.size + 36)
                      put("WAVE".toByteArray()); put("fmt ".toByteArray())
                      putInt(16); putShort(1); putShort(1); putInt(sr)
                      putInt(sr * 2); putShort(2); putShort(16)
                      put("data".toByteArray()); putInt(pcm.size)
                  }.array()
                  return header + pcm
              }

              private fun startForegroundNotif() {
                  val id = "jp_th_sub_channel"
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel(id, "JP-TH Live Sub", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, id)
                      .setContentTitle("JP-TH Live Subtitle กำลังทำงาน")
                      .setSmallIcon(R.drawable.ic_launcher_foreground)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
                  audioChannel.close()
                  try { audioRecord?.stop(); audioRecord?.release() } catch (_: Exception) {}
                  if (::overlayRoot.isInitialized) windowManager.removeView(overlayRoot)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
