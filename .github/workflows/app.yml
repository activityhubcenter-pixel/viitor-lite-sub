                  overlayRoot.addView(bottomBar)

                  overlayParams = WindowManager.LayoutParams(
                      (initSw * 0.88).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (initSw * 0.06).toInt()
                      y = initSh - 420
                  }

                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                  var isDraggingBox = false
                  val dragAndTapListener = View.OnTouchListener { _, e ->
                      if (isLocked) return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              ix = overlayParams.x
                              iy = overlayParams.y
                              tx = e.rawX
                              ty = e.rawY
                              isDraggingBox = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tx).toInt()
                              val dy = (e.rawY - ty).toInt()
                              if (abs(dx) > 12 || abs(dy) > 12) {
                                  isDraggingBox = true
                                  val curSw = resources.displayMetrics.widthPixels
                                  val curSh = resources.displayMetrics.heightPixels
                                  overlayParams.x = (ix + dx).coerceIn(0, (curSw - 120).coerceAtLeast(0))
                                  overlayParams.y = (iy + dy).coerceIn(0, (curSh - 80).coerceAtLeast(0))
                                  windowManager.updateViewLayout(overlayRoot, overlayParams)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              revealMenuAndScheduleHide()
                              true
                          }
                          else -> false
                      }
                  }

                  overlayRoot.setOnTouchListener(dragAndTapListener)
                  textContainer.setOnTouchListener(dragAndTapListener)
                  thTextView.setOnTouchListener(dragAndTapListener)
                  prevThTextView.setOnTouchListener(dragAndTapListener)
                  srcTextView.setOnTouchListener(dragAndTapListener)

                  var startW = 0; var startH = 0; var rtx = 0f; var rty = 0f
                  resizeHandle.setOnTouchListener { v, e ->
                      if (isLocked) return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              v.parent?.requestDisallowInterceptTouchEvent(true)
                              startW = overlayRoot.width
                              startH = overlayRoot.height
                              rtx = e.rawX
                              rty = e.rawY
                              mainHandler.removeCallbacks(autoHideMenuRunnable)
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val curSw = resources.displayMetrics.widthPixels
                              val curSh = resources.displayMetrics.heightPixels
                              val maxAllowedW = (curSw - overlayParams.x).coerceAtLeast(320)
                              val maxAllowedH = (curSh - overlayParams.y).coerceAtLeast(140)
                              val newW = (startW + (e.rawX - rtx).toInt()).coerceIn(280, maxAllowedW)
                              val newH = (startH + (e.rawY - rty).toInt()).coerceIn(130, maxAllowedH)
                              overlayParams.width = newW
                              overlayParams.height = newH
                              windowManager.updateViewLayout(overlayRoot, overlayParams)
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              revealMenuAndScheduleHide()
                              true
                          }
                          else -> false
                      }
                  }

                  windowManager.addView(overlayRoot, overlayParams)
                  revealMenuAndScheduleHide()
              }

              private fun updateStatus(text: String, colorHex: String) {
                  mainHandler.post {
                      if (!isPaused) {
                          statusLabel.text = text
                          statusLabel.setTextColor(Color.parseColor(colorHex))
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startAudioCapture() {
                  val proj = mediaProjection ?: return
                  val config = AudioPlaybackCaptureConfiguration.Builder(proj)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val sr = 16000
                  val fmt = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(sr)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()

                  val minBuf = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  audioRecord = AudioRecord.Builder()
                      .setAudioPlaybackCaptureConfig(config)
                      .setAudioFormat(fmt)
                      .setBufferSizeInBytes(minBuf * 2)
                      .build()

                  if (audioRecord?.state != AudioRecord.STATE_INITIALIZED) {
                      updateStatus("● ดักเสียงไม่ได้ (แชร์ทั้งหน้าจอ)", "#F87171")
                      return
                  }

                  audioRecord?.startRecording()

                  scope.launch {
                      // 512 samples (1024 bytes) ตรงกับ windowSize ของ Silero VAD
                      val buf = ByteArray(1024)
                      var lastUiUpdate = 0L

                      while (isActive) {
                          val read = audioRecord?.read(buf, 0, buf.size) ?: 0
                          if (isPaused) {
                              vad?.reset()
                              continue
                          }
                          if (read > 0) {
                              val floats = pcmToFloatArray(buf, read)
                              val currentVad = vad
                              if (currentVad != null) {
                                  currentVad.acceptWaveform(floats)
                                  val now = System.currentTimeMillis()
                                  if (currentVad.isSpeechDetected() && now - lastUiUpdate > 350) {
                                      updateStatus("● ได้ยินเสียงพูด...", "#34D399")
                                      lastUiUpdate = now
                                  }
                                  while (!currentVad.empty()) {
                                      val segment = currentVad.front()
                                      val speechSamples = segment.samples
                                      currentVad.pop()
                                      if (speechSamples.isNotEmpty()) {
                                          audioChannel.trySend(speechSamples)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              private fun startOfflineEngine() {
                  scope.launch {
                      try {
                          val mlSrc = when (srcLang) {
                              "en" -> TranslateLanguage.ENGLISH
                              "ko" -> TranslateLanguage.KOREAN
                              else -> TranslateLanguage.JAPANESE
                          }
                          val mlOptions = TranslatorOptions.Builder()
                              .setSourceLanguage(mlSrc)
                              .setTargetLanguage(TranslateLanguage.THAI)
                              .build()
                          translator = Translation.getClient(mlOptions)
                          translator?.downloadModelIfNeeded(DownloadConditions.Builder().build())

                          val vadConfig = VadModelConfig(
                              sileroVadModelConfig = SileroVadModelConfig(
                                  model = "silero_vad.onnx",
                                  threshold = 0.5f,
                                  minSilenceDuration = 0.45f,
                                  minSpeechDuration = 0.25f,
                                  windowSize = 512,
                                  maxSpeechDuration = 3.8f
                              ),
                              sampleRate = 16000,
                              numThreads = 1,
                              debug = false
                          )
                          vad = Vad(assetManager = assets, config = vadConfig)

                          val config = OfflineRecognizerConfig(
                              featConfig = FeatureConfig(sampleRate = 16000, featureDim = 80),
                              modelConfig = OfflineModelConfig(
                                  senseVoice = OfflineSenseVoiceModelConfig(
                                      model = "model.int8.onnx",
                                      language = srcLang,
                                      useInverseTextNormalization = true
                                  ),
                                  tokens = "tokens.txt",
                                  numThreads = 4,
                                  debug = false
                              )
                          )
                          recognizer = OfflineRecognizer(assetManager = assets, config = config)
                          val modeLabel = if (groqKey.isNotEmpty()) "● พร้อมฟัง (AI บริบท + กรองเสียง)" else "● พร้อมฟัง (ออฟไลน์ + กรองเสียง)"
                          updateStatus(modeLabel, "#34D399")
                      } catch (e: Exception) {
                          updateStatus("● โหลดโมเดลพลาด: ${e.message}", "#F87171")
                          return@launch
                      }

                      for (samples in audioChannel) {
                          if (isPaused) continue
                          val rec = recognizer ?: continue

                          val stream = rec.createStream()
                          stream.acceptWaveform(samples, 16000)
                          rec.decode(stream)
                          val rawText = rec.getResult(stream).text
                          stream.release()

                          val cleanSrc = rawText.replace(Regex("<\\|[^|]+\\|>"), "").trim()
                          if (cleanSrc.any { it.isLetterOrDigit() }) {
                              val historySnapshot = synchronized(contextHistory) { contextHistory.toList() }
                              val thText = if (groqKey.isNotEmpty()) {
                                  translateWithGroq(cleanSrc, historySnapshot) ?: translateOffline(cleanSrc)
                              } else {
                                  translateOffline(cleanSrc)
                              }

                              synchronized(contextHistory) {
                                  if (contextHistory.size >= 3) {
                                      contextHistory.removeFirst()
                                  }
                                  contextHistory.addLast(cleanSrc)
                              }

                              withContext(Dispatchers.Main) {
                                  if (showBilingual) {
                                      srcTextView.visibility = View.VISIBLE
                                      srcTextView.text = cleanSrc
                                  } else {
                                      srcTextView.visibility = View.GONE
                                  }
                                  if (lastTranslatedLine.isNotEmpty() && lastTranslatedLine != thText) {
                                      prevThTextView.visibility = View.VISIBLE
                                      prevThTextView.text = lastTranslatedLine
                                  }
                                  lastTranslatedLine = thText
                                  thTextView.text = thText
                                  textScrollView.post { textScrollView.fullScroll(View.FOCUS_DOWN) }
                                  statusLabel.text = if (groqKey.isNotEmpty()) "● พร้อมฟัง (AI บริบท)" else "● พร้อมฟัง"
                                  statusLabel.setTextColor(Color.parseColor("#34D399"))
                              }
                          } else {
                              updateStatus("● กรองเสียงที่ไม่ใช่คำพูด...", "#94A3B8")
                          }
                      }
                  }
              }

              private fun translateWithGroq(text: String, history: List<String>): String? {
                  return try {
                      val url = URL("https://api.groq.com/openai/v1/chat/completions")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Authorization", "Bearer $groqKey")
                          setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                          doOutput = true
                          connectTimeout = 4000
                          readTimeout = 4000
                      }

                      val userContent = if (history.isNotEmpty()) {
                          "บริบทประโยคก่อนหน้า:\n${history.joinToString("\n")}\n\nประโยคล่าสุดที่ต้องแปล:\n$text"
                      } else {
                          text
                      }

                      val body = JSONObject().apply {
                          put("model", "llama-3.3-70b-versatile")
                          put("temperature", 0.3)
                          put("max_tokens", 120)
                          put("messages", JSONArray().apply {
                              put(JSONObject().put("role", "system").put("content",
                                  "คุณคือนักแปลซับไตเติลมืออาชีพ แปลเฉพาะ 'ประโยคล่าสุด' เป็นภาษาพูดไทยที่เข้าใจง่าย เป็นธรรมชาติ กระชับ เหมือนซับซีรีส์หรืออนิเมะ ใช้บริบทก่อนหน้าเพื่อเดาตัวประธาน (ฉัน/คุณ/เขา/เธอ) และความต่อเนื่องของเรื่องให้ถูกต้อง ห้ามแปลบริบทก่อนหน้าซ้ำ ตอบเฉพาะคำแปลภาษาไทยเท่านั้น"))
                              put(JSONObject().put("role", "user").put("content", userContent))
                          })
                      }
                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      if (conn.responseCode == 200) {
                          val resp = conn.inputStream.bufferedReader().use { it.readText() }
                          JSONObject(resp).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                      } else null
                  } catch (_: Exception) {
                      null
                  }
              }

              private suspend fun translateOffline(text: String): String = suspendCancellableCoroutine { cont ->
                  val t = translator
                  if (t == null) {
                      cont.resume(text)
                      return@suspendCancellableCoroutine
                  }
                  t.translate(text)
                      .addOnSuccessListener { result ->
                          if (cont.isActive) cont.resume(result)
                      }
                      .addOnFailureListener {
                          if (cont.isActive) cont.resume(text)
                      }
              }

              private fun pcmToFloatArray(pcm: ByteArray, len: Int): FloatArray {
                  val count = len / 2
                  val floats = FloatArray(count)
                  for (i in 0 until count) {
                      val lo = pcm[i * 2].toInt() and 0xFF
                      val hi = pcm[i * 2 + 1].toInt()
                      val sample = ((hi shl 8) or lo).toShort()
                      floats[i] = sample / 32768.0f
                  }
                  return floats
              }

              private fun updateNotification() {
                  val mgr = getSystemService(NotificationManager::class.java)
                  mgr.createNotificationChannel(
                      NotificationChannel(NOTIF_CHANNEL_ID, "Live Subtitle", NotificationManager.IMPORTANCE_LOW)
                  )

                  val unlockIntent = Intent(this, LiveTranslateService::class.java).apply {
                      action = ACTION_UNLOCK
                  }
                  val unlockPi = PendingIntent.getService(
                      this,
                      10,
                      unlockIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val contentText = if (isLocked) {
                      "โหมดล็อกทะลุหน้าจอทำงานอยู่ • แตะที่นี่เพื่อปลดล็อกกล่องซับ"
                  } else {
                      "กำลังแปลซับลอยจอ • แตะที่นี่เพื่อเรียกแถบเมนู"
                  }

                  val notif = Notification.Builder(this, NOTIF_CHANNEL_ID)
                      .setContentTitle("Live Subtitle v1.0")
                      .setContentText(contentText)
                      .setSmallIcon(R.drawable.ic_launcher_foreground)
                      .setContentIntent(unlockPi)
                      .addAction(
                          Notification.Action.Builder(
                              null,
                              if (isLocked) "ปลดล็อกกล่องซับ" else "แสดงเมนูซับ",
                              unlockPi
                          ).build()
                      )
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  mainHandler.removeCallbacks(autoHideMenuRunnable)
                  scope.cancel()
                  audioChannel.close()
                  try { audioRecord?.stop(); audioRecord?.release() } catch (_: Exception) {}
                  try { vad?.release() } catch (_: Exception) {}
                  try { recognizer?.release() } catch (_: Exception) {}
                  try { translator?.close() } catch (_: Exception) {}
                  if (::overlayRoot.isInitialized) windowManager.removeView(overlayRoot)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
