                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END or Gravity.CENTER_VERTICAL
                  }

                  val resizeHandle = TextView(this).apply {
                      text = "⤢"
                      textSize = 15f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setPadding(16, 0, 2, 0)
                  }

                  bottomBar.addView(resizeHandle)

                  overlayRoot.addView(topBar)
                  overlayRoot.addView(textScrollView)
                  overlayRoot.addView(bottomBar)

                  overlayParams = WindowManager.LayoutParams(
                      (sw * 0.90).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (sw * 0.05).toInt()
                      y = sh - 420
                  }

                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                  overlayRoot.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ix = overlayParams.x; iy = overlayParams.y; tx = e.rawX; ty = e.rawY; true }
                          MotionEvent.ACTION_MOVE -> {
                              overlayParams.x = ix + (e.rawX - tx).toInt()
                              overlayParams.y = iy + (e.rawY - ty).toInt()
                              windowManager.updateViewLayout(overlayRoot, overlayParams)
                              true
                          }
                          else -> false
                      }
                  }

                  var startW = 0; var startH = 0; var rtx = 0f; var rty = 0f
                  resizeHandle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startW = overlayRoot.width
                              startH = overlayRoot.height
                              rtx = e.rawX
                              rty = e.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val newW = (startW + (e.rawX - rtx).toInt()).coerceIn((sw * 0.45).toInt(), (sw * 0.98).toInt())
                              val newH = (startH + (e.rawY - rty).toInt()).coerceIn(130, (sh * 0.65).toInt())
                              overlayParams.width = newW
                              overlayParams.height = newH
                              windowManager.updateViewLayout(overlayRoot, overlayParams)
                              true
                          }
                          else -> false
                      }
                  }

                  windowManager.addView(overlayRoot, overlayParams)
              }

              private fun updateStatus(text: String, colorHex: String) {
                  mainHandler.post {
                      if (!isPaused) {
                          statusLabel.text = text
                          statusLabel.setTextColor(Color.parseColor(colorHex))
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startAudioCapture() {
                  val proj = mediaProjection ?: return
                  val config = AudioPlaybackCaptureConfiguration.Builder(proj)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val sr = 16000
                  val fmt = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(sr)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()

                  val minBuf = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  audioRecord = AudioRecord.Builder()
                      .setAudioPlaybackCaptureConfig(config)
                      .setAudioFormat(fmt)
                      .setBufferSizeInBytes(minBuf * 2)
                      .build()

                  if (audioRecord?.state != AudioRecord.STATE_INITIALIZED) {
                      updateStatus("● ดักเสียงไม่ได้ (แชร์ทั้งหน้าจอ)", "#F87171")
                      return
                  }

                  audioRecord?.startRecording()

                  scope.launch {
                      val buf = ByteArray(1024)
                      val acc = ByteArrayOutputStream()
                      var startT = System.currentTimeMillis()
                      var lastSpeechT = 0L
                      var hasSpeech = false
                      var lastUiUpdate = 0L

                      while (isActive) {
                          val read = audioRecord?.read(buf, 0, buf.size) ?: 0
                          if (isPaused) {
                              acc.reset()
                              hasSpeech = false
                              continue
                          }
                          if (read > 0) {
                              val rms = calcRms(buf, read)
                              val now = System.currentTimeMillis()

                              if (rms > 110.0) {
                                  if (!hasSpeech && now - lastUiUpdate > 300) {
                                      updateStatus("● ได้ยินเสียง...", "#34D399")
                                      lastUiUpdate = now
                                  }
                                  hasSpeech = true
                                  lastSpeechT = now
                              }

                              if (hasSpeech) acc.write(buf, 0, read) else startT = now

                              val elapsed = now - startT
                              val silence = now - lastSpeechT
                              // รอจังหวะเว้นวรรค 0.55 วิ หรือสูงสุด 3.2 วิ เพื่อให้ได้ประโยคสมบูรณ์ขึ้น
                              if (hasSpeech && ((silence > 550 && elapsed > 900) || elapsed >= 3200)) {
                                  val pcm = acc.toByteArray()
                                  acc.reset()
                                  hasSpeech = false
                                  startT = now
                                  audioChannel.trySend(pcm)
                              }
                          }
                      }
                  }
              }

              private fun startOfflineEngine() {
                  scope.launch {
                      try {
                          val mlSrc = when (srcLang) {
                              "en" -> TranslateLanguage.ENGLISH
                              "ko" -> TranslateLanguage.KOREAN
                              else -> TranslateLanguage.JAPANESE
                          }
                          val mlOptions = TranslatorOptions.Builder()
                              .setSourceLanguage(mlSrc)
                              .setTargetLanguage(TranslateLanguage.THAI)
                              .build()
                          translator = Translation.getClient(mlOptions)
                          translator?.downloadModelIfNeeded(DownloadConditions.Builder().build())

                          val config = OfflineRecognizerConfig(
                              featConfig = FeatureConfig(sampleRate = 16000, featureDim = 80),
                              modelConfig = OfflineModelConfig(
                                  senseVoice = OfflineSenseVoiceModelConfig(
                                      model = "model.int8.onnx",
                                      language = srcLang,
                                      useInverseTextNormalization = true
                                  ),
                                  tokens = "tokens.txt",
                                  numThreads = 4,
                                  debug = false
                              )
                          )
                          recognizer = OfflineRecognizer(assetManager = assets, config = config)
                          val modeLabel = if (groqKey.isNotEmpty()) "● พร้อมฟัง (AI สำนวนธรรมชาติ)" else "● พร้อมฟัง (ออฟไลน์ 100%)"
                          updateStatus(modeLabel, "#34D399")
                      } catch (e: Exception) {
                          updateStatus("● โหลดโมเดลพลาด: ${e.message}", "#F87171")
                          return@launch
                      }

                      for (pcm in audioChannel) {
                          if (isPaused) continue
                          val rec = recognizer ?: continue

                          val samples = pcmToFloatArray(pcm)
                          val stream = rec.createStream()
                          stream.acceptWaveform(samples, 16000)
                          rec.decode(stream)
                          val rawText = rec.getResult(stream).text
                          stream.release()

                          val cleanSrc = rawText.replace(Regex("<\\|[^|]+\\|>"), "").trim()
                          if (cleanSrc.any { it.isLetterOrDigit() }) {
                              val thText = if (groqKey.isNotEmpty()) {
                                  translateWithGroq(cleanSrc) ?: translateOffline(cleanSrc)
                              } else {
                                  translateOffline(cleanSrc)
                              }

                              withContext(Dispatchers.Main) {
                                  if (showBilingual) {
                                      srcTextView.visibility = View.VISIBLE
                                      srcTextView.text = cleanSrc
                                  } else {
                                      srcTextView.visibility = View.GONE
                                  }
                                  if (lastTranslatedLine.isNotEmpty() && lastTranslatedLine != thText) {
                                      prevThTextView.visibility = View.VISIBLE
                                      prevThTextView.text = lastTranslatedLine
                                  }
                                  lastTranslatedLine = thText
                                  thTextView.text = thText
                                  textScrollView.post { textScrollView.fullScroll(View.FOCUS_DOWN) }
                                  statusLabel.text = if (groqKey.isNotEmpty()) "● พร้อมฟัง (AI)" else "● พร้อมฟัง"
                                  statusLabel.setTextColor(Color.parseColor("#34D399"))
                              }
                          } else {
                              updateStatus("● รอเสียงพูด...", "#94A3B8")
                          }
                      }
                  }
              }

              private fun translateWithGroq(text: String): String? {
                  return try {
                      val url = URL("https://api.groq.com/openai/v1/chat/completions")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Authorization", "Bearer $groqKey")
                          setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                          doOutput = true
                          connectTimeout = 4000
                          readTimeout = 4000
                      }
                      val body = JSONObject().apply {
                          put("model", "llama-3.3-70b-versatile")
                          put("temperature", 0.3)
                          put("max_tokens", 120)
                          put("messages", JSONArray().apply {
                              put(JSONObject().put("role", "system").put("content",
                                  "คุณคือนักแปลซับไตเติลมืออาชีพ แปลประโยคที่ได้รับเป็นภาษาพูดไทยที่เข้าใจง่าย เป็นธรรมชาติ กระชับ เหมือนซับซีรีส์หรืออนิเมะ ไม่แปลตรงตัวแข็งทื่อ ตอบเฉพาะคำแปลภาษาไทยเท่านั้น ห้ามอธิบายเพิ่ม"))
                              put(JSONObject().put("role", "user").put("content", text))
                          })
                      }
                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      if (conn.responseCode == 200) {
                          val resp = conn.inputStream.bufferedReader().use { it.readText() }
                          JSONObject(resp).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim()
                      } else null
                  } catch (_: Exception) {
                      null
                  }
              }

              private suspend fun translateOffline(text: String): String = suspendCancellableCoroutine { cont ->
                  val t = translator
                  if (t == null) {
                      cont.resume(text)
                      return@suspendCancellableCoroutine
                  }
                  t.translate(text)
                      .addOnSuccessListener { result ->
                          if (cont.isActive) cont.resume(result)
                      }
                      .addOnFailureListener {
                          if (cont.isActive) cont.resume(text)
                      }
              }

              private fun pcmToFloatArray(pcm: ByteArray): FloatArray {
                  val count = pcm.size / 2
                  val floats = FloatArray(count)
                  for (i in 0 until count) {
                      val lo = pcm[i * 2].toInt() and 0xFF
                      val hi = pcm[i * 2 + 1].toInt()
                      val sample = ((hi shl 8) or lo).toShort()
                      floats[i] = sample / 32768.0f
                  }
                  return floats
              }

              private fun calcRms(buf: ByteArray, len: Int): Double {
                  var sum = 0.0
                  val count = len / 2
                  if (count == 0) return 0.0
                  for (i in 0 until len - 1 step 2) {
                      val s = ((buf[i + 1].toInt() shl 8) or (buf[i].toInt() and 0xFF)).toShort()
                      sum += s * s
                  }
                  return sqrt(sum / count)
              }

              private fun startForegroundNotif() {
                  val id = "jp_th_sub_channel"
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel(id, "JP-TH Live Sub", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, id)
                      .setContentTitle("Live Subtitle v2.1 กำลังทำงาน")
                      .setSmallIcon(R.drawable.ic_launcher_foreground)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
                  audioChannel.close()
                  try { audioRecord?.stop(); audioRecord?.release() } catch (_: Exception) {}
                  try { recognizer?.release() } catch (_: Exception) {}
                  try { translator?.close() } catch (_: Exception) {}
                  if (::overlayRoot.isInitialized) windowManager.removeView(overlayRoot)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
