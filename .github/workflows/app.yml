name: Build ViiTor Lite Offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Android Project & Download On-Device AI Models
        run: |
          mkdir -p app/src/main/java/com/example/jpthtranslator
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets
          mkdir -p app/libs

          # ดาวน์โหลดไลบรารี Sherpa-ONNX สำหรับ Android
          AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.30/sherpa-onnx-1.10.30.aar"
          if ! curl -L -f -o app/libs/sherpa-onnx.aar "$AAR_URL"; then
            TAG=$(curl -s https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
            curl -L -f -o app/libs/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${TAG}/sherpa-onnx-${TAG}.aar"
          fi

          # ดาวน์โหลดโมเดล AI แกะเสียง SenseVoice (รองรับ ญี่ปุ่น / อังกฤษ / เกาหลี / จีน)
          curl -L -f -o sensevoice.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2"
          tar -xjf sensevoice.tar.bz2
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/model.int8.onnx app/src/main/assets/
          cp sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/tokens.txt app/src/main/assets/
          rm -rf sensevoice.tar.bz2 sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JPTHLiveSubOffline"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.jpthtranslator"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.jpthtranslator"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 5
                  versionName = "2.0-Offline"
                  ndk {
                      abiFilters += "arm64-v8a"
                  }
              }
              androidResources {
                  noCompress += "onnx"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation(files("libs/sherpa-onnx.aar"))
              implementation("com.google.mlkit:translate:17.0.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#1D4ED8</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#2660A5FA"
                  android:pathData="M54,16A38,38 0 1,1 54,92A38,38 0 1,1 54,16Z" />

              <path
                  android:fillColor="#0F172A"
                  android:pathData="M30,30h34a6,6 0 0,1 6,6v20a6,6 0 0,1 -6,6h-22l-7,6v-6h-5a6,6 0 0,1 -6,-6v-20a6,6 0 0,1 6,-6z" />

              <path
                  android:strokeColor="#38BDF8"
                  android:strokeWidth="3"
                  android:strokeLineCap="round"
                  android:pathData="M39,43v6 M45,39v14 M51,41v10 M57,44v4" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M42,48h36a6,6 0 0,1 6,6v18a6,6 0 0,1 -6,6h-6v6l-7,-6h-23a6,6 0 0,1 -6,-6v-18a6,6 0 0,1 6,-6z" />

              <path
                  android:strokeColor="#1E3A8A"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round"
                  android:pathData="M49,59h22 M49,67h14" />

              <path
                  android:fillColor="#F59E0B"
                  android:pathData="M71,67m-2.2,0a2.2,2.2 0 1,1 4.4,0a2.2,2.2 0 1,1 -4.4,0" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="JP-TH Live Sub"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LiveTranslateService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/jpthtranslator/MainActivity.kt
          package com.example.jpthtranslator

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.*
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions

          class MainActivity : Activity() {

              private lateinit var langSpinner: Spinner
              private lateinit var bilingualSwitch: Switch
              private lateinit var statusText: TextView
              private var selectedLangCode = "ja"

              private val langLabels = arrayOf(
                  "ภาษาญี่ปุ่น (JP) → ไทย",
                  "ภาษาอังกฤษ (EN) → ไทย",
                  "ภาษาเกาหลี (KO) → ไทย"
              )
              private val langCodes = arrayOf("ja", "en", "ko")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("sub_prefs", Context.MODE_PRIVATE)
                  selectedLangCode = prefs.getString("src_lang", "ja") ?: "ja"

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(56, 80, 56, 56)
                  }

                  val title = TextView(this).apply {
                      text = "Live Subtitle (Offline AI)"
                      textSize = 24f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 12)
                  }

                  val desc = TextView(this).apply {
                      text = "ประมวลผลเสียงในตัวเครื่อง 100% ไม่ง้อ API Key และไม่จำกัดโควตา"
                      textSize = 14f
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, 0, 0, 44)
                  }

                  val spinnerBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#1E293B"))
                      cornerRadius = 24f
                      setStroke(2, Color.parseColor("#334155"))
                  }

                  langSpinner = Spinner(this).apply {
                      background = spinnerBg
                      setPadding(24, 24, 24, 24)
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          langLabels
                      ).apply {
                          setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                      }
                      setSelection(langCodes.indexOf(selectedLangCode).coerceAtLeast(0))
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(parent: AdapterView<*>?, view: View?, pos: Int, id: Long) {
                              (view as? TextView)?.setTextColor(Color.WHITE)
                              selectedLangCode = langCodes[pos]
                              prefs.edit().putString("src_lang", selectedLangCode).apply()
                              prepareOfflineLanguagePack(selectedLangCode)
                          }
                          override fun onNothingSelected(parent: AdapterView<*>?) {}
                      }
                  }

                  bilingualSwitch = Switch(this).apply {
                      text = "แสดงซับต้นฉบับคู่กับคำแปลไทย"
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      isChecked = prefs.getBoolean("bilingual", false)
                      setPadding(8, 44, 8, 44)
                  }

                  val startBtnBg = GradientDrawable().apply {
                      setColor(Color.parseColor("#2563EB"))
                      cornerRadius = 28f
                  }

                  val startBtn = Button(this).apply {
                      text = "เปิดซับไตเติลลอยจอ"
                      setTextColor(Color.WHITE)
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      background = startBtnBg
                      setPadding(0, 32, 0, 32)
                      setOnClickListener {
                          prefs.edit()
                              .putBoolean("bilingual", bilingualSwitch.isChecked)
                              .putString("src_lang", selectedLangCode)
                              .apply()
                          checkPermissionsAndStart()
                      }
                  }

                  val stopBtn = Button(this).apply {
                      text = "หยุดการทำงาน"
                      setTextColor(Color.parseColor("#F87171"))
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(0, 28, 0, 28)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, LiveTranslateService::class.java))
                          statusText.text = "สถานะ: หยุดการทำงานแล้ว"
                      }
                  }

                  statusText = TextView(this).apply {
                      text = "สถานะ: กำลังตรวจสอบชุดภาษาออฟไลน์..."
                      textSize = 14f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setPadding(0, 24, 0, 0)
                  }

                  root.addView(title)
                  root.addView(desc)
                  root.addView(langSpinner)
                  root.addView(bilingualSwitch)
                  root.addView(startBtn)
                  root.addView(stopBtn)
                  root.addView(statusText)
                  setContentView(root)

                  prepareOfflineLanguagePack(selectedLangCode)
              }

              private fun prepareOfflineLanguagePack(langCode: String) {
                  statusText.text = "สถานะ: กำลังเตรียมชุดภาษาออฟไลน์ (~30MB)..."
                  statusText.setTextColor(Color.parseColor("#FBBF24"))

                  val mlSrc = when (langCode) {
                      "en" -> TranslateLanguage.ENGLISH
                      "ko" -> TranslateLanguage.KOREAN
                      else -> TranslateLanguage.JAPANESE
                  }
                  val options = TranslatorOptions.Builder()
                      .setSourceLanguage(mlSrc)
                      .setTargetLanguage(TranslateLanguage.THAI)
                      .build()

                  val client = Translation.getClient(options)
                  val conditions = DownloadConditions.Builder().build()
                  client.downloadModelIfNeeded(conditions)
                      .addOnSuccessListener {
                          statusText.text = "สถานะ: พร้อมใช้งานออฟไลน์ 100% (ไม่จำกัดโควตา)"
                          statusText.setTextColor(Color.parseColor("#34D399"))
                          client.close()
                      }
                      .addOnFailureListener {
                          statusText.text = "สถานะ: กรุณาต่อเน็ตครั้งแรกเพื่อโหลดชุดภาษา (~30MB)"
                          statusText.setTextColor(Color.parseColor("#F87171"))
                          client.close()
                      }
              }

              private fun checkPermissionsAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "กรุณาเปิดสิทธิ์ 'แสดงทับแอปอื่น' แล้วกดย้อนกลับ", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = perms.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), 100)
                  } else {
                      requestAudioCapture()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  if (requestCode == 100 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      requestAudioCapture()
                  } else {
                      statusText.text = "จำเป็นต้องอนุญาตสิทธิ์เสียงก่อนใช้งาน"
                  }
              }

              private fun requestAudioCapture() {
                  val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  startActivityForResult(mgr.createScreenCaptureIntent(), 200)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 200 && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, LiveTranslateService::class.java).apply {
                          putExtra("RESULT_CODE", resultCode)
                          putExtra("DATA", data)
                          putExtra("SRC_LANG", selectedLangCode)
                          putExtra("BILINGUAL", bilingualSwitch.isChecked)
                      }
                      startForegroundService(intent)
                      statusText.text = "กำลังทำงาน: เปิด Chrome เล่นวิดีโอได้เลย"
                      moveTaskToBack(true)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/jpthtranslator/LiveTranslateService.kt
          package com.example.jpthtranslator

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.*
          import android.widget.LinearLayout
          import android.widget.TextView
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions
          import com.k2fsa.sherpa.onnx.FeatureConfig
          import com.k2fsa.sherpa.onnx.OfflineModelConfig
          import com.k2fsa.sherpa.onnx.OfflineRecognizer
          import com.k2fsa.sherpa.onnx.OfflineRecognizerConfig
          import com.k2fsa.sherpa.onnx.OfflineSenseVoiceModelConfig
          import kotlinx.coroutines.*
          import kotlinx.coroutines.channels.BufferOverflow
          import kotlinx.coroutines.channels.Channel
          import java.io.ByteArrayOutputStream
          import kotlin.coroutines.resume
          import kotlin.math.sqrt

          class LiveTranslateService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var overlayRoot: LinearLayout
              private lateinit var statusLabel: TextView
              private lateinit var srcTextView: TextView
              private lateinit var thTextView: TextView

              private var mediaProjection: MediaProjection? = null
              private var audioRecord: AudioRecord? = null
              private var recognizer: OfflineRecognizer? = null
              private var translator: Translator? = null

              private var srcLang = "ja"
              private var showBilingual = false
              private var isPaused = false
              private var fontSize = 17f

              private val mainHandler = Handler(Looper.getMainLooper())
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private val audioChannel = Channel<ByteArray>(capacity = 1, onBufferOverflow = BufferOverflow.DROP_OLDEST)

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundNotif()
                  val resultCode = intent?.getIntExtra("RESULT_CODE", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  srcLang = intent.getStringExtra("SRC_LANG") ?: "ja"
                  showBilingual = intent.getBooleanExtra("BILINGUAL", false)

                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra("DATA", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent.getParcelableExtra("DATA")
                  }

                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  setupOverlay()
                  val mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = mgr.getMediaProjection(resultCode, data)
                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, mainHandler)

                  startOfflineEngine()
                  startAudioCapture()
                  return START_STICKY
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupOverlay() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val sw = resources.displayMetrics.widthPixels
                  val sh = resources.displayMetrics.heightPixels

                  val bg = GradientDrawable().apply {
                      setColor(Color.parseColor("#EB0F172A"))
                      cornerRadius = 32f
                      setStroke(2, Color.parseColor("#38BDF8"))
                  }

                  overlayRoot = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = bg
                      setPadding(32, 18, 32, 22)
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 0, 0, 8)
                  }

                  statusLabel = TextView(this).apply {
                      text = "● กำลังโหลด AI ลงเครื่อง..."
                      textSize = 12f
                      setTextColor(Color.parseColor("#FBBF24"))
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val fontDownBtn = TextView(this).apply {
                      text = " A- "
                      textSize = 13f
                      setTextColor(Color.LTGRAY)
                      setPadding(12, 4, 12, 4)
                      setOnClickListener {
                          fontSize = (fontSize - 2f).coerceAtLeast(12f)
                          thTextView.textSize = fontSize
                          srcTextView.textSize = (fontSize - 3f).coerceAtLeast(10f)
                      }
                  }

                  val fontUpBtn = TextView(this).apply {
                      text = " A+ "
                      textSize = 13f
                      setTextColor(Color.LTGRAY)
                      setPadding(12, 4, 12, 4)
                      setOnClickListener {
                          fontSize = (fontSize + 2f).coerceAtMost(28f)
                          thTextView.textSize = fontSize
                          srcTextView.textSize = (fontSize - 3f).coerceAtLeast(10f)
                      }
                  }

                  val pauseBtn = TextView(this).apply {
                      text = " ⏸ "
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setPadding(14, 4, 14, 4)
                      setOnClickListener {
                          isPaused = !isPaused
                          text = if (isPaused) " ▶ " else " ⏸ "
                          statusLabel.text = if (isPaused) "● หยุดแปลชั่วคราว" else "● พร้อมฟัง (ออฟไลน์)"
                          statusLabel.setTextColor(if (isPaused) Color.parseColor("#FBBF24") else Color.parseColor("#34D399"))
                      }
                  }

                  val closeBtn = TextView(this).apply {
                      text = " ✕"
                      textSize = 16f
                      setTextColor(Color.parseColor("#F87171"))
                      setPadding(14, 4, 4, 4)
                      setOnClickListener { stopSelf() }
                  }

                  topBar.addView(statusLabel)
                  topBar.addView(fontDownBtn)
                  topBar.addView(fontUpBtn)
                  topBar.addView(pauseBtn)
                  topBar.addView(closeBtn)

                  srcTextView = TextView(this).apply {
                      text = ""
                      textSize = fontSize - 3f
                      setTextColor(Color.parseColor("#94A3B8"))
                      visibility = View.GONE
                      setPadding(0, 0, 0, 6)
                  }

                  thTextView = TextView(this).apply {
                      text = "เปิดวิดีโอใน Chrome ได้เลย (ออฟไลน์ 100%)..."
                      textSize = fontSize
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }

                  overlayRoot.addView(topBar)
                  overlayRoot.addView(srcTextView)
                  overlayRoot.addView(thTextView)

                  val params = WindowManager.LayoutParams(
                      (sw * 0.92).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (sw * 0.04).toInt()
                      y = sh - 400
                  }

                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                  overlayRoot.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ix = params.x; iy = params.y; tx = e.rawX; ty = e.rawY; true }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = ix + (e.rawX - tx).toInt()
                              params.y = iy + (e.rawY - ty).toInt()
                              windowManager.updateViewLayout(overlayRoot, params)
                              true
                          }
                          else -> false
                      }
                  }
                  windowManager.addView(overlayRoot, params)
              }

              private fun updateStatus(text: String, colorHex: String) {
                  mainHandler.post {
                      if (!isPaused) {
                          statusLabel.text = text
                          statusLabel.setTextColor(Color.parseColor(colorHex))
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startAudioCapture() {
                  val proj = mediaProjection ?: return
                  val config = AudioPlaybackCaptureConfiguration.Builder(proj)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()

                  val sr = 16000
                  val fmt = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(sr)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()

                  val minBuf = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  audioRecord = AudioRecord.Builder()
                      .setAudioPlaybackCaptureConfig(config)
                      .setAudioFormat(fmt)
                      .setBufferSizeInBytes(minBuf * 2)
                      .build()

                  if (audioRecord?.state != AudioRecord.STATE_INITIALIZED) {
                      updateStatus("● ดักเสียงไม่ได้ (ลองเลือกแชร์ทั้งหน้าจอ)", "#F87171")
                      return
                  }

                  audioRecord?.startRecording()

                  scope.launch {
                      val buf = ByteArray(1024)
                      val acc = ByteArrayOutputStream()
                      var startT = System.currentTimeMillis()
                      var lastSpeechT = 0L
                      var hasSpeech = false
                      var lastUiUpdate = 0L

                      while (isActive) {
                          val read = audioRecord?.read(buf, 0, buf.size) ?: 0
                          if (isPaused) {
                              acc.reset()
                              hasSpeech = false
                              continue
                          }
                          if (read > 0) {
                              val rms = calcRms(buf, read)
                              val now = System.currentTimeMillis()

                              if (rms > 110.0) {
                                  if (!hasSpeech && now - lastUiUpdate > 300) {
                                      updateStatus("● ได้ยินเสียง...", "#34D399")
                                      lastUiUpdate = now
                                  }
                                  hasSpeech = true
                                  lastSpeechT = now
                              }

                              if (hasSpeech) acc.write(buf, 0, read) else startT = now

                              val elapsed = now - startT
                              val silence = now - lastSpeechT
                              // ตัดประโยคไวทุกๆ 0.4 วิที่เงียบ หรือสูงสุด 2.4 วิ (ไม่จำกัดโควตา)
                              if (hasSpeech && ((silence > 400 && elapsed > 700) || elapsed >= 2400)) {
                                  val pcm = acc.toByteArray()
                                  acc.reset()
                                  hasSpeech = false
                                  startT = now
                                  audioChannel.trySend(pcm)
                              }
                          }
                      }
                  }
              }

              private fun startOfflineEngine() {
                  scope.launch {
                      try {
                          val mlSrc = when (srcLang) {
                              "en" -> TranslateLanguage.ENGLISH
                              "ko" -> TranslateLanguage.KOREAN
                              else -> TranslateLanguage.JAPANESE
                          }
                          val mlOptions = TranslatorOptions.Builder()
                              .setSourceLanguage(mlSrc)
                              .setTargetLanguage(TranslateLanguage.THAI)
                              .build()
                          translator = Translation.getClient(mlOptions)
                          translator?.downloadModelIfNeeded(DownloadConditions.Builder().build())

                          val config = OfflineRecognizerConfig(
                              featConfig = FeatureConfig(sampleRate = 16000, featureDim = 80),
                              modelConfig = OfflineModelConfig(
                                  senseVoice = OfflineSenseVoiceModelConfig(
                                      model = "model.int8.onnx",
                                      language = srcLang,
                                      useInverseTextNormalization = true
                                  ),
                                  tokens = "tokens.txt",
                                  numThreads = 4,
                                  debug = false
                              )
                          )
                          recognizer = OfflineRecognizer(assetManager = assets, config = config)
                          updateStatus("● พร้อมฟัง (ออฟไลน์ 100%)", "#34D399")
                      } catch (e: Exception) {
                          updateStatus("● โหลดโมเดลไม่สำเร็จ: ${e.message}", "#F87171")
                          return@launch
                      }

                      for (pcm in audioChannel) {
                          if (isPaused) continue
                          val rec = recognizer ?: continue

                          val samples = pcmToFloatArray(pcm)
                          val stream = rec.createStream()
                          stream.acceptWaveform(samples, 16000)
                          rec.decode(stream)
                          val rawText = rec.getResult(stream).text
                          stream.release()

                          val cleanSrc = rawText.replace(Regex("<\\|[^|]+\\|>"), "").trim()
                          if (cleanSrc.any { it.isLetterOrDigit() }) {
                              val thText = translateOffline(cleanSrc)
                              withContext(Dispatchers.Main) {
                                  if (showBilingual) {
                                      srcTextView.visibility = View.VISIBLE
                                      srcTextView.text = cleanSrc
                                  } else {
                                      srcTextView.visibility = View.GONE
                                  }
                                  thTextView.text = thText
                                  statusLabel.text = "● พร้อมฟัง (ออฟไลน์)"
                                  statusLabel.setTextColor(Color.parseColor("#34D399"))
                              }
                          } else {
                              updateStatus("● รอเสียงพูด...", "#94A3B8")
                          }
                      }
                  }
              }

              private suspend fun translateOffline(text: String): String = suspendCancellableCoroutine { cont ->
                  val t = translator
                  if (t == null) {
                      cont.resume(text)
                      return@suspendCancellableCoroutine
                  }
                  t.translate(text)
                      .addOnSuccessListener { result ->
                          if (cont.isActive) cont.resume(result)
                      }
                      .addOnFailureListener {
                          if (cont.isActive) cont.resume(text)
                      }
              }

              private fun pcmToFloatArray(pcm: ByteArray): FloatArray {
                  val count = pcm.size / 2
                  val floats = FloatArray(count)
                  for (i in 0 until count) {
                      val lo = pcm[i * 2].toInt() and 0xFF
                      val hi = pcm[i * 2 + 1].toInt()
                      val sample = ((hi shl 8) or lo).toShort()
                      floats[i] = sample / 32768.0f
                  }
                  return floats
              }

              private fun calcRms(buf: ByteArray, len: Int): Double {
                  var sum = 0.0
                  val count = len / 2
                  if (count == 0) return 0.0
                  for (i in 0 until len - 1 step 2) {
                      val s = ((buf[i + 1].toInt() shl 8) or (buf[i].toInt() and 0xFF)).toShort()
                      sum += s * s
                  }
                  return sqrt(sum / count)
              }

              private fun startForegroundNotif() {
                  val id = "jp_th_sub_channel"
                  getSystemService(NotificationManager::class.java).createNotificationChannel(
                      NotificationChannel(id, "JP-TH Live Sub", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, id)
                      .setContentTitle("Live Subtitle (Offline AI) กำลังทำงาน")
                      .setSmallIcon(R.drawable.ic_launcher_foreground)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
                  audioChannel.close()
                  try { audioRecord?.stop(); audioRecord?.release() } catch (_: Exception) {}
                  try { recognizer?.release() } catch (_: Exception) {}
                  try { translator?.close() } catch (_: Exception) {}
                  if (::overlayRoot.isInitialized) windowManager.removeView(overlayRoot)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
