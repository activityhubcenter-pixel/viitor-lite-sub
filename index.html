<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Live Subtitle</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --primary: #2563eb; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: #fff; padding: 14px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 960px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #94a3b8; font-size: 12.5px; margin: 0 0 12px; }
    .panel {
      background: rgba(9, 14, 26, 0.96); border: 1px solid #334155; border-radius: 16px;
      padding: 12px; margin-bottom: 12px;
    }
    .panel.hidden { display: none; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    select, input[type="text"] {
      background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 10px;
      padding: 10px 12px; font-size: 14px; flex: 1; min-width: 135px;
    }
    button {
      background: var(--primary); color: #fff; border: none; border-radius: 10px;
      padding: 10px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    }
    button.stop { background: #dc2626; }
    button.pip { background: #0284c7; }
    button.secondary { background: #334155; }
    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cbd5e1; }
    .outline-text {
      text-shadow:
        -1.5px -1.5px 0 #000,
         1.5px -1.5px 0 #000,
        -1.5px  1.5px 0 #000,
         1.5px  1.5px 0 #000,
         0px    2px   6px rgba(0, 0, 0, 0.95);
    }
    #subBox {
      position: relative; width: 100%; min-height: 135px; border-radius: 18px; padding: 16px 18px 30px;
      border: 2px solid rgba(56, 189, 248, 0.65);
      background: rgba(15, 23, 42, 0.82);
      overflow: auto; transition: background 0.15s; cursor: pointer;
    }
    #subBox.locked { pointer-events: none; border-color: rgba(56, 189, 248, 0.25); }
    #status { font-size: 12px; color: #34d399; margin-bottom: 6px; }
    #srcText { font-size: 14px; color: #cbd5e1; margin-bottom: 6px; min-height: 18px; }
    #prevTh { font-size: 15px; color: #e2e8f0; margin-bottom: 6px; }
    #thText { font-size: 20px; font-weight: 700; line-height: 1.45; color: #ffffff; }
    #webResizeHandle {
      position: absolute; right: 8px; bottom: 6px; background: rgba(6, 11, 22, 0.95);
      color: #38bdf8; border: 1px solid #38bdf8; border-radius: 8px; padding: 3px 10px;
      font-size: 12px; font-weight: 700; touch-action: none; user-select: none;
    }
    #webResizeHandle.hidden { display: none; }
    #floatingUnlockBtn {
      display: none; position: fixed; right: 16px; bottom: 16px; z-index: 9999;
      background: rgba(6, 11, 22, 0.95); color: #38bdf8; border: 1px solid #38bdf8;
      border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700;
    }
    #pipVideo {
      position: fixed; right: 2px; bottom: 2px; width: 2px; height: 2px;
      opacity: 0.01; pointer-events: none; z-index: -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Live Subtitle</h1>
    <p class="sub">ซับไตเติลแปลสดพร้อมหน้าต่างลอย (PiP) • ซ่อนเมนูอัตโนมัติใน 5 วินาที</p>

    <div class="panel" id="controlPanel">
      <div class="row">
        <select id="langSelect">
          <option value="ja-JP">ญี่ปุ่น (JP) → ไทย</option>
          <option value="en-US">อังกฤษ (EN) → ไทย</option>
          <option value="ko-KR">เกาหลี (KO) → ไทย</option>
        </select>
        <button id="startBtn" onclick="toggleListen()">เริ่มฟังและแปลสด</button>
        <button class="pip" onclick="openPiP()">หน้าต่างลอย (PiP)</button>
        <button class="secondary" onclick="toggleWebLock()">🔓 ล็อกทะลุ</button>
      </div>

      <div class="row">
        <input type="text" id="groqKey" placeholder="Groq API Key (ไม่บังคับ - ช่วยแปลตามบริบทสำนวนธรรมชาติ)" />
      </div>

      <div class="row" style="justify-content: space-between; margin-bottom: 0;">
        <div class="slider-group">
          <span>ความเข้มพื้นหลัง:</span>
          <input type="range" id="opacityRange" min="5" max="98" value="82" oninput="updateOpacity(this.value)" />
        </div>
        <div class="slider-group">
          <button class="secondary" onclick="changeFont(-2)">A-</button>
          <button class="secondary" onclick="changeFont(2)">A+</button>
          <label><input type="checkbox" id="showOrig" checked /> โชว์ต้นฉบับ</label>
        </div>
      </div>
    </div>

    <div id="subBox" onclick="revealWebMenu()">
      <div id="status" class="outline-text">● พร้อมใช้งาน (กด "เริ่มฟังและแปลสด")</div>
      <div id="srcText" class="outline-text"></div>
      <div id="prevTh" class="outline-text"></div>
      <div id="thText" class="outline-text">กดปุ่ม "เริ่มฟังและแปลสด" เพื่อเริ่มใช้งาน</div>
      <div id="webResizeHandle">⤢ ขยาย</div>
    </div>
  </div>

  <button id="floatingUnlockBtn" onclick="toggleWebLock()">🔒 ปลดล็อกกล่องซับ</button>

  <canvas id="pipCanvas" width="760" height="240" style="display:none;"></canvas>
  <video id="pipVideo" playsinline webkit-playsinline muted></video>

  <script>
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let recognition = null;
    let isListening = false;
    let isWebLocked = false;
    let fontSize = 20;
    let currentTh = "รอเสียงพูด...";
    let prevTh = "";
    let currentSrc = "";
    let translateTimer = null;
    let restartTimer = null;
    let pipInterval = null;
    let lastTranslatedSrc = "";
    let hideMenuTimer = null;
    const contextHistory = [];

    const groqInput = document.getElementById('groqKey');
    groqInput.value = localStorage.getItem('web_groq_key') || '';
    groqInput.addEventListener('change', () => localStorage.setItem('web_groq_key', groqInput.value.trim()));

    function setStatus(msg, color = '#34d399') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.style.color = color;
    }

    function toggleWebLock() {
      isWebLocked = !isWebLocked;
      const box = document.getElementById('subBox');
      const panel = document.getElementById('controlPanel');
      const handle = document.getElementById('webResizeHandle');
      const unlockBtn = document.getElementById('floatingUnlockBtn');

      if (isWebLocked) {
        box.classList.add('locked');
        panel.classList.add('hidden');
        handle.classList.add('hidden');
        unlockBtn.style.display = 'block';
        clearTimeout(hideMenuTimer);
      } else {
        box.classList.remove('locked');
        unlockBtn.style.display = 'none';
        revealWebMenu();
      }
    }

    function revealWebMenu() {
      if (isWebLocked) return;
      document.getElementById('controlPanel').classList.remove('hidden');
      document.getElementById('webResizeHandle').classList.remove('hidden');
      clearTimeout(hideMenuTimer);
      hideMenuTimer = setTimeout(() => {
        if (isListening && !isWebLocked) {
          document.getElementById('controlPanel').classList.add('hidden');
          document.getElementById('webResizeHandle').classList.add('hidden');
        }
      }, 5000);
    }

    document.getElementById('controlPanel').addEventListener('click', revealWebMenu);
    document.getElementById('controlPanel').addEventListener('input', revealWebMenu);

    const subBox = document.getElementById('subBox');
    const resizeHandle = document.getElementById('webResizeHandle');
    let resizing = false, startX = 0, startY = 0, startW = 0, startH = 0;

    function startResize(cx, cy) {
      if (isWebLocked) return;
      resizing = true;
      startX = cx;
      startY = cy;
      startW = subBox.offsetWidth;
      startH = subBox.offsetHeight;
      clearTimeout(hideMenuTimer);
    }
    function doResize(cx, cy) {
      if (!resizing) return;
      const maxW = window.innerWidth - 20;
      const newW = Math.min(maxW, Math.max(250, startW + (cx - startX)));
      const newH = Math.min(window.innerHeight * 0.78, Math.max(120, startH + (cy - startY)));
      subBox.style.width = newW + 'px';
      subBox.style.height = newH + 'px';
    }
    function endResize() {
      if (resizing) {
        resizing = false;
        revealWebMenu();
      }
    }

    resizeHandle.addEventListener('mousedown', e => { e.stopPropagation(); startResize(e.clientX, e.clientY); });
    window.addEventListener('mousemove', e => doResize(e.clientX, e.clientY));
    window.addEventListener('mouseup', endResize);

    resizeHandle.addEventListener('touchstart', e => {
      e.stopPropagation();
      const t = e.touches[0];
      startResize(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (!resizing) return;
      const t = e.touches[0];
      doResize(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchend', endResize);

    function updateOpacity(val) {
      subBox.style.background = `rgba(15, 23, 42, ${val / 100})`;
      revealWebMenu();
    }

    function changeFont(delta) {
      fontSize = Math.min(34, Math.max(14, fontSize + delta));
      document.getElementById('thText').style.fontSize = fontSize + 'px';
      revealWebMenu();
    }

    async function translateText(text) {
      if (!text || text === lastTranslatedSrc) return;
      lastTranslatedSrc = text;
      const key = groqInput.value.trim();

      if (key) {
        try {
          const userContent = contextHistory.length > 0
            ? `บริบทประโยคก่อนหน้า:\n${contextHistory.join('\n')}\n\nประโยคล่าสุดที่ต้องแปล:\n${text}`
            : text;

          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'llama-3.3-70b-versatile',
              temperature: 0.3,
              max_tokens: 120,
              messages: [
                { role: 'system', content: 'คุณคือนักแปลซับไตเติลมืออาชีพ แปลเฉพาะประโยคล่าสุดเป็นภาษาพูดไทยที่เข้าใจง่าย เป็นธรรมชาติ กระชับ ใช้บริบทก่อนหน้าเพื่อระบุตัวประธานให้ถูกต้อง ห้ามแปลบริบทก่อนหน้าซ้ำ ตอบเฉพาะคำแปลภาษาไทยเท่านั้น' },
                { role: 'user', content: userContent }
              ]
            })
          });
          if (res.ok) {
            const data = await res.json();
            pushContext(text);
            setSubtitle(data.choices[0].message.content.trim());
            return;
          }
        } catch (e) {}
      }

      try {
        const sl = document.getElementById('langSelect').value.split('-')[0];
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=th&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        const translated = data[0].map(item => item[0]).join('');
        pushContext(text);
        setSubtitle(translated);
      } catch (e) {
        setStatus('● แปลขัดข้องชั่วคราว กำลังฟังต่อ...', '#fbbf24');
      }
    }

    function pushContext(line) {
      if (contextHistory.length >= 3) contextHistory.shift();
      contextHistory.push(line);
    }

    function setSubtitle(th) {
      if (currentTh && currentTh !== th && currentTh !== "รอเสียงพูด...") {
        prevTh = currentTh;
        document.getElementById('prevTh').textContent = prevTh;
      }
      currentTh = th;
      document.getElementById('thText').textContent = th;
      drawPiPCanvas();
    }

    function toggleListen() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert('เบราว์เซอร์นี้ไม่รองรับการถอดเสียง กรุณาเปิดด้วย Google Chrome หรือ Edge');
        return;
      }
      if (isListening) {
        isListening = false;
        clearTimeout(restartTimer);
        if (recognition) {
          try { recognition.onend = null; recognition.stop(); } catch (_) {}
        }
        document.getElementById('startBtn').textContent = 'เริ่มฟังและแปลสด';
        document.getElementById('startBtn').classList.remove('stop');
        setStatus('● หยุดฟังแล้ว', '#94a3b8');
        revealWebMenu();
        return;
      }

      isListening = true;
      document.getElementById('startBtn').textContent = 'หยุดการฟัง';
      document.getElementById('startBtn').classList.add('stop');
      setStatus('● กำลังฟังเสียงสด...', '#34d399');
      revealWebMenu();

      const launchRec = () => {
        if (!isListening) return;
        recognition = new SpeechRec();
        recognition.lang = document.getElementById('langSelect').value;
        recognition.continuous = !isIOS;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          transcript = transcript.trim();
          if (!transcript) return;

          currentSrc = transcript;
          document.getElementById('srcText').textContent = document.getElementById('showOrig').checked ? transcript : '';
          drawPiPCanvas();

          clearTimeout(translateTimer);
          const isFinal = event.results[event.results.length - 1].isFinal;
          translateTimer = setTimeout(() => translateText(transcript), isFinal ? 80 : 600);
        };

        recognition.onend = () => {
          if (isListening) {
            clearTimeout(restartTimer);
            restartTimer = setTimeout(launchRec, 80);
          }
        };

        try { recognition.start(); } catch (_) { restartTimer = setTimeout(launchRec, 250); }
      };

      launchRec();
    }

    function drawPiPCanvas() {
      const canvas = document.getElementById('pipCanvas');
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

      if (document.getElementById('showOrig').checked && currentSrc) {
        ctx.font = '22px sans-serif';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText(currentSrc.slice(-45), 24, 48);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(currentSrc.slice(-45), 24, 48);
      }

      ctx.font = 'bold 31px sans-serif';
      wrapOutlinedText(ctx, currentTh, 24, 105, canvas.width - 48, 42);
    }

    function wrapOutlinedText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = text.split('');
      let line = '';
      let curY = y;
      for (let n = 0; n < chars.length; n++) {
        const testLine = line + chars[n];
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          drawOutlinedLine(ctx, line, x, curY);
          line = chars[n];
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      drawOutlinedLine(ctx, line, x, curY);
    }

    function drawOutlinedLine(ctx, line, x, y) {
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 5;
      ctx.lineJoin = 'round';
      ctx.strokeText(line, x, y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(line, x, y);
    }

    async function openPiP() {
      try {
        drawPiPCanvas();
        if (!pipInterval) {
          pipInterval = setInterval(drawPiPCanvas, 250);
        }
        const canvas = document.getElementById('pipCanvas');
        const video = document.getElementById('pipVideo');
        if (!video.srcObject) {
          const stream = canvas.captureStream ? canvas.captureStream(15) : canvas.webkitCaptureStream(15);
          video.srcObject = stream;
        }
        await video.play();

        if (typeof video.webkitSetPresentationMode === 'function') {
          const targetMode = video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture';
          video.webkitSetPresentationMode(targetMode);
        } else if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (video.requestPictureInPicture) {
          await video.requestPictureInPicture();
        }
      } catch (e) {
        alert('เบราว์เซอร์นี้ไม่รองรับหน้าต่างลอย (PiP)');
      }
    }
  </script>
</body>
</html>
